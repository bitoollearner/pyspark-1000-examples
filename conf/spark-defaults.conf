# ---------------------------------------------------------------------------
# spark-defaults.conf — the exact configuration the book uses.
#
# Deterministic-output tuning:
#   - Small shuffle partitions (4) so example output is fast and readable
#   - AQE disabled so plans in the book stay consistent with runs
#   - Fixed timezone so timestamp examples don't vary by host
# ---------------------------------------------------------------------------

# --- Delta Lake ---------------------------------------------------------
spark.sql.extensions                     io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog          org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- deterministic output ----------------------------------------------
spark.sql.shuffle.partitions             4
spark.sql.adaptive.enabled               false
spark.sql.session.timeZone               UTC

# --- resource limits (local dev) ---------------------------------------
spark.driver.memory                      2g
spark.executor.memory                    2g

# --- verbose Spark UI --------------------------------------------------
spark.eventLog.enabled                   true
spark.eventLog.dir                       file:///workspace/spark-events
